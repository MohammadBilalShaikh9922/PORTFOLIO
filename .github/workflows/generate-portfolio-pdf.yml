
name: Generate Portfolio PDF

on:
  push:
    branches:
      - main
    paths-ignore:
      - "portfolio.pdf"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-pdf-generation
  cancel-in-progress: false

jobs:
  generate-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install PDF generation dependency
        run: npm install --no-save playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate portfolio PDF
        run: node .github/scripts/generate-pdf.cjs

      - name: Commit updated PDF
        run: |
          if git status --porcelain -- portfolio.pdf | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add portfolio.pdf
            git commit -m "chore: regenerate portfolio PDF"
            git push
          else
            echo "The generated PDF has not changed."
          fi


name: Generate CV PDF

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "style.css"
      - "script.js"
      - "Mohammad_Bilal_Shaikh.docx"
      - ".github/scripts/generate-cv.py"
      - ".github/workflows/generate-portfolio-pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-cv-pdf
  cancel-in-progress: false

jobs:
  generate-cv:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-docx beautifulsoup4

      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice

      - name: Generate CV PDF
        run: python .github/scripts/generate-cv.py

      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio.pdf
          if git diff --cached --quiet; then
            echo "The generated PDF has not changed."
          else
            git commit -m "chore: update generated CV PDF"
            git push
          fi
